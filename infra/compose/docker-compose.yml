services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: civicledger
      POSTGRES_PASSWORD: civicledger_dev_only
      POSTGRES_DB: civicledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicledger -d civicledger"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - civicledger-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: civicledger_dev
      MINIO_ROOT_PASSWORD: civicledger_dev_only_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - civicledger-minio:/data

volumes:
  civicledger-postgres:
  civicledger-minio:
