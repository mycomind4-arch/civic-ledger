name: Bootstrap workspace

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "infra/**"
      - "test/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: civicledger
          POSTGRES_PASSWORD: civicledger
          POSTGRES_DB: civicledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicledger -d civicledger"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://civicledger:civicledger@localhost:5432/civicledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate up
        run: pnpm migrate
      - name: Test
        run: pnpm test
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-8-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Fail when typecheck failed
        if: ${{ steps.typecheck.outcome == 'failure' }}
        run: exit 1
      - name: Build
        if: ${{ steps.typecheck.outcome == 'success' }}
        run: pnpm build
      - name: Migrate down and up
        if: ${{ steps.typecheck.outcome == 'success' }}
        run: |
          pnpm migrate:down
          pnpm migrate
