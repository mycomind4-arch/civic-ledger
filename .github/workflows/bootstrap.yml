name: Bootstrap workspace

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "vitest.config.ts"
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "test/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate
      - name: Generate lockfile
        id: lockfile
        continue-on-error: true
        run: pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee pnpm-install.log
      - name: Install and validate
        if: steps.lockfile.outcome == 'success'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-diagnostics
          path: |
            pnpm-install.log
            pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 1
      - name: Fail when lockfile generation failed
        if: steps.lockfile.outcome != 'success'
        run: exit 1
